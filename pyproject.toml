[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-models-as-judges"
version = "0.1.0"
description = "Typed decision models as evaluation judges"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2",
    "typer",
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "openai",
    "typesafe-sdk",
    "streamlit",
    "tau-bench @ git+https://github.com/sierra-research/tau-bench@59a200c6d575d595120f1cb70fea53cef0632f6b",
]

[project.optional-dependencies]
laya = [
    "torch",
    "transformers",
]

[project.scripts]
judges = "decision_judges.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "mypy",
    "pandas-stubs",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["decision_judges"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
